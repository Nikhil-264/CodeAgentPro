- id: py-easy-01
  task: "Write a Python function `two_sum(nums: list[int], target: int) -> list[int]` that returns indices of the two numbers such that they add up to target. Each input has exactly one solution. Return indices in ascending order."
  language: "Python"
  framework: "standard library"
  difficulty: "easy"
  acceptance_test: |
    import pytest
    from solution import two_sum

    def test_two_sum_basic():
        assert two_sum([2, 7, 11, 15], 9) == [0, 1]

    def test_two_sum_unordered():
        assert two_sum([3, 2, 4], 6) == [1, 2]

    def test_two_sum_same_value():
        assert two_sum([3, 3], 6) == [0, 1]

