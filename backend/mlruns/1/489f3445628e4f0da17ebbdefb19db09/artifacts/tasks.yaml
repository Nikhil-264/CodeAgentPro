- id: py-hard-02
  task: "Write a Python function `topological_sort(num_nodes: int, edges: list[list[int]]) -> list[int]` that returns a valid topological ordering of nodes (0 to num_nodes - 1) for a Directed Acyclic Graph specified by directed edges [u, v]. If a cycle exists, return an empty list `[]`."
  language: "Python"
  framework: "standard library"
  difficulty: "hard"
  acceptance_test: |
    import pytest
    from solution import topological_sort

    def test_valid_dag():
        res = topological_sort(4, [[1,0],[2,0],[3,1],[3,2]])
        pos = {node: i for i, node in enumerate(res)}
        assert len(res) == 4
        assert pos[3] < pos[1] and pos[3] < pos[2]
        assert pos[1] < pos[0] and pos[2] < pos[0]

    def test_cycle_detection():
        assert topological_sort(2, [[0,1],[1,0]]) == []

