- id: js-med-01
  task: "Write a JavaScript function `deepClone(obj)` that creates a deep copy of an object, handling nested objects, arrays, Date objects, RegExp objects, and primitives."
  language: "JavaScript"
  framework: "node"
  difficulty: "medium"
  acceptance_test: |
    const test = require('node:test');
    const assert = require('node:assert');
    const fs = require('fs');
    const vm = require('vm');

    const code = fs.readFileSync('./solution.js', 'utf8');
    const context = { console, module: { exports: {} }, exports: {}, Date, RegExp };
    vm.createContext(context);
    vm.runInContext(code, context);
    const fn = context.deepClone || context.module.exports.deepClone || context.exports.deepClone;

    test('deep clone objects and dates', () => {
        const d = new Date(1700000000000);
        const original = { a: 1, b: { c: [2, 3] }, d: d };
        const copy = fn(original);
        assert.notStrictEqual(copy, original);
        assert.notStrictEqual(copy.b, original.b);
        assert.deepStrictEqual(copy.b.c, [2, 3]);
        assert.strictEqual(copy.d.getTime(), d.getTime());
    });

- id: js-med-02
  task: "Write a JavaScript function `debounce(fn, delay)` that returns a debounced version of the function `fn` which delays its execution until after `delay` milliseconds have elapsed since the last call."
  language: "JavaScript"
  framework: "node"
  difficulty: "medium"
  acceptance_test: |
    const test = require('node:test');
    const assert = require('node:assert');
    const fs = require('fs');
    const vm = require('vm');

    const code = fs.readFileSync('./solution.js', 'utf8');
    const context = { console, module: { exports: {} }, exports: {}, setTimeout, clearTimeout };
    vm.createContext(context);
    vm.runInContext(code, context);
    const fn = context.debounce || context.module.exports.debounce || context.exports.debounce;

    test('debounce delays execution', (t, done) => {
        let count = 0;
        const debounced = fn(() => { count++; }, 50);
        debounced();
        debounced();
        debounced();
        assert.strictEqual(count, 0);
        setTimeout(() => {
            assert.strictEqual(count, 1);
            done();
        }, 100);
    });

- id: js-hard-01
  task: "Write a JavaScript `EventEmitter` class supporting `on(event, listener)`, `off(event, listener)`, `once(event, listener)`, and `emit(event, ...args)`. Return an unsubscribe function from `on` and `once`."
  language: "JavaScript"
  framework: "node"
  difficulty: "hard"
  acceptance_test: |
    const test = require('node:test');
    const assert = require('node:assert');
    const fs = require('fs');
    const vm = require('vm');

    const code = fs.readFileSync('./solution.js', 'utf8');
    const context = { console, module: { exports: {} }, exports: {} };
    vm.createContext(context);
    vm.runInContext(code, context);
    const EE = context.EventEmitter || context.module.exports.EventEmitter || context.exports.EventEmitter;

    test('event emitter on, emit, once, off', () => {
        const emitter = new EE();
        let sum = 0;
        const add = (val) => { sum += val; };
        emitter.on('add', add);
        emitter.emit('add', 5);
        assert.strictEqual(sum, 5);

        let onceCount = 0;
        emitter.once('single', () => { onceCount++; });
        emitter.emit('single');
        emitter.emit('single');
        assert.strictEqual(onceCount, 1);

        emitter.off('add', add);
        emitter.emit('add', 10);
        assert.strictEqual(sum, 5);
    });

- id: js-hard-02
  task: "Write a JavaScript class `AsyncTaskQueue(concurrency)` that executes async tasks added via `push(taskFn)` returning a Promise that resolves with taskFn's result, executing at most `concurrency` tasks simultaneously."
  language: "JavaScript"
  framework: "node"
  difficulty: "hard"
  acceptance_test: |
    const test = require('node:test');
    const assert = require('node:assert');
    const fs = require('fs');
    const vm = require('vm');

    const code = fs.readFileSync('./solution.js', 'utf8');
    const context = { console, module: { exports: {} }, exports: {}, Promise, setTimeout };
    vm.createContext(context);
    vm.runInContext(code, context);
    const Queue = context.AsyncTaskQueue || context.module.exports.AsyncTaskQueue || context.exports.AsyncTaskQueue;

    test('async task queue concurrency limit', async () => {
        const q = new Queue(2);
        let active = 0;
        let maxActive = 0;
        const makeTask = (val, ms) => () => new Promise(resolve => {
            active++;
            if (active > maxActive) maxActive = active;
            setTimeout(() => {
                active--;
                resolve(val);
            }, ms);
        });

        const p1 = q.push(makeTask(1, 50));
        const p2 = q.push(makeTask(2, 50));
        const p3 = q.push(makeTask(3, 50));
        const results = await Promise.all([p1, p2, p3]);
        assert.deepStrictEqual(results, [1, 2, 3]);
        assert.strictEqual(maxActive, 2);
    });

