- id: py-med-01
  task: "Write a Python class `LRUCache(capacity: int)` implementing an LRU cache with `get(key: int) -> int` (returns value if present, else -1) and `put(key: int, value: int)` in O(1) average time complexity."
  language: "Python"
  framework: "standard library"
  difficulty: "medium"
  acceptance_test: |
    import pytest
    from solution import LRUCache

    def test_lru_operations():
        cache = LRUCache(2)
        cache.put(1, 1)
        cache.put(2, 2)
        assert cache.get(1) == 1
        cache.put(3, 3) # evicts key 2
        assert cache.get(2) == -1
        cache.put(4, 4) # evicts key 1
        assert cache.get(1) == -1
        assert cache.get(3) == 3
        assert cache.get(4) == 4

