  language: "C++"
  framework: "standard library"
  difficulty: "hard"
  acceptance_test: |
    #include <iostream>
    #include <cassert>
    #include <vector>

    int shortestPath(int numNodes, const std::vector<std::vector<int>>& edges, int src, int dst);

    int main() {
        std::vector<std::vector<int>> edges = {
            {0, 1, 4}, {0, 2, 1}, {2, 1, 2}, {1, 3, 1}, {2, 3, 5}
        };
        assert(shortestPath(4, edges, 0, 3) == 4); // 0->2 (1), 2->1 (2), 1->3 (1) = 4
