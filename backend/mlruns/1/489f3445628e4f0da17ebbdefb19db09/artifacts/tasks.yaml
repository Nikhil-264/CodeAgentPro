- id: cpp-med-01
  task: "Write a C++ class `MinStack` supporting `push(int val)`, `pop()`, `top() -> int`, and `getMin() -> int`, each operating in O(1) time complexity. Do not include a main function."
  language: "C++"
  framework: "standard library"
  difficulty: "medium"
  acceptance_test: |
    #include <iostream>
    #include <cassert>
    #include <stack>

    class MinStack {
    public:
        MinStack();
        void push(int val);
        void pop();
        int top();
        int getMin();
    };

    int main() {
        MinStack s;
        s.push(-2);
        s.push(0);
        s.push(-3);
        assert(s.getMin() == -3);
        s.pop();
        assert(s.top() == 0);
        assert(s.getMin() == -2);
        std::cout << "All MinStack tests passed!\n";
        return 0;
    }

