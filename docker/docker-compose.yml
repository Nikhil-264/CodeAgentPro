version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - OLLAMA_HOST=host.docker.internal   # Points to Ollama on host machine
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

